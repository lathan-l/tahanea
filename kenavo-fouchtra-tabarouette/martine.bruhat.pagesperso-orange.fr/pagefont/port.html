HEIGHT=300 ALIGN=bottom></CENTER></P>

<P><CENTER>Cette fontaine, en bas de la rue du Port, tout pr&egrave;s
de l'&eacute;glise Notre Dame du Port (magnifique, art roman, XII
si&egrave;cle), a &eacute;t&eacute; remise en eau r&eacute;cemment,
comme beaucoup d'autres &agrave; Clermont. Pendant toute une
p&eacute;riode elles &eacute;taient remplies de terre et
plant&eacute;es de fleurs en &eacute;t&eacute;.&nbsp;</CENTER></P>
